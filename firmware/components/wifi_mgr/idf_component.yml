## ESP32-P4 沒有 WiFi，透過板上的 ESP32-C6 連線。
## esp_hosted 鎖在 2.11.x：
##   - 板上 C6 的 slave 韌體必須用同一版建置（2026-11-22 實測 C6 是 2.3.0，出廠 demo 的 host 是 2.11.0）。
##   - 不鎖會拉到 3.x，3.x 另外依賴 cherryusb、esp_tinyusb、usb_host_cdc_acm，和 scanner 的 USB Host 無關且未驗證。
## 實際版本記在 dependencies.lock，必須一起 commit。
dependencies:
  espressif/esp_wifi_remote: ">=1.6.0,<2.0.0"
  espressif/esp_hosted: "~2.11.0"
