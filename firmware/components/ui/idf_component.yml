## 螢幕：Guition JC1060P470（7 吋 1024x600 MIPI-DSI、GT911 觸控）。
## 面板晶片是 JD9165：出廠程式呼叫 esp_lcd_new_panel_jd9165()（開機 log 的 EK79007 字樣是 BSP 留下的）。
## 實際版本記在 dependencies.lock。
dependencies:
  lvgl/lvgl: "^9.2.0"
  espressif/esp_lvgl_port: "^2.6.0"
  espressif/esp_lcd_jd9165: "^2.0.2"
  espressif/esp_lcd_touch_gt911: "^1.1.0"
